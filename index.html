<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso de Emprendedores</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0f172a;
  color:white;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px;
  background:linear-gradient(120deg,#0ea5e9,#22c55e);
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  opacity:.9;
}

/* BOTONES */
.btn{
  display:inline-block;
  margin-top:20px;
  background:#22c55e;
  color:white;
  padding:14px 25px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
  transition:.3s;
}

.btn:hover{
  transform:scale(1.07);
  background:#16a34a;
}

/* SERVICIOS */
.servicios{
  padding:60px 20px;
  text-align:center;
}

.grid-servicios{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-top:30px;
}

.card-servicio{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  cursor:pointer;
  transition:.4s;
}

.card-servicio img{
  width:100%;
  height:180px;
  object-fit:cover;
  filter:brightness(.7);
}

.card-servicio:hover{
  transform:scale(1.07);
}

.titulo{
  position:absolute;
  bottom:10px;
  left:10px;
  color:white;
  font-weight:bold;
  font-size:18px;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.8);
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  background:white;
  color:black;
  padding:25px;
  border-radius:18px;
  max-width:500px;
  animation:subir .4s ease;
}

.modal-content span{
  float:right;
  cursor:pointer;
  font-weight:bold;
}

@keyframes subir{
  from{transform:translateY(60px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* FOOTER */
.footer{
  text-align:center;
  padding:40px 20px;
  opacity:.6;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>🚀 Curso de Emprendedores</h1>
  <p>Aprende a generar ingresos desde cero aunque no tengas experiencia</p>
  <a href="#comprar" class="btn">Quiero empezar</a>
</section>

<!-- SERVICIOS -->
<section class="servicios">
  <h2>🔥 Lo que aprenderás</h2>

  <div class="grid-servicios">

    <div class="card-servicio" onclick="abrirServicio(0)">
      <img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7">
      <div class="titulo">Valida tu idea</div>
    </div>

    <div class="card-servicio" onclick="abrirServicio(1)">
      <img src="https://images.unsplash.com/photo-1556157382-97eda2d62296">
      <div class="titulo">Modelo de negocio</div>
    </div>

    <div class="card-servicio" onclick="abrirServicio(2)">
      <img src="https://images.unsplash.com/photo-1552664730-d307ca884978">
      <div class="titulo">Ventas inteligentes</div>
    </div>

    <div class="card-servicio" onclick="abrirServicio(3)">
      <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71">
      <div class="titulo">Marketing real</div>
    </div>

  </div>
</section>

<!-- MODAL -->
<div id="modalServicio" class="modal">
  <div class="modal-content">
    <span onclick="cerrarServicio()">✖</span>
    <h3 id="tituloServicio"></h3>
    <p id="textoServicio"></p>
  </div>
</div>

<!-- COMPRA -->
<section id="comprar" style="text-align:center;padding:60px 20px;background:#020617">
  <h2>💳 Acceso inmediato</h2>
  <p>Pago único — acceso para siempre</p>

  <!-- BOTÓN DE PAGO -->
  <a href="https://mpago.la/1SEiJBr" target="_blank" class="btn" onclick="enviarWhatsapp()">
    Comprar ahora
  </a>
</section>

<div class="footer">
  © 2026 Curso de Emprendedores
</div>

<script>
const datos = [
  {
    titulo:"Valida tu idea",
    texto:"Aprende a comprobar si tu idea puede generar dinero antes de invertir tiempo o dinero."
  },
  {
    titulo:"Modelo de negocio",
    texto:"Crea una estructura clara para convertir cualquier idea en ingresos reales."
  },
  {
    titulo:"Ventas inteligentes",
    texto:"Estrategias para vender incluso si nunca has vendido nada."
  },
  {
    titulo:"Marketing real",
    texto:"Cómo conseguir clientes sin gastar en publicidad."
  }
];

function abrirServicio(i){
  document.getElementById("modalServicio").style.display="flex";
  document.getElementById("tituloServicio").innerText=datos[i].titulo;
  document.getElementById("textoServicio").innerText=datos[i].texto;
}

function cerrarServicio(){
  document.getElementById("modalServicio").style.display="none";
}

/* WHATSAPP AUTOMÁTICO */
function enviarWhatsapp(){
  setTimeout(()=>{
    window.open("https://wa.me/qr/Q3V6TYFKLD3EA1","_blank");
  },4000);
}
</script>

</body>
</html>
