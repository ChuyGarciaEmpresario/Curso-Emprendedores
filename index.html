<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generación DM</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#020617;
  color:white;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px;
  background:linear-gradient(120deg,#0ea5e9,#22c55e);
}

.hero h1{
  font-size:28px;
}

/* GRID TARJETAS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  padding:40px 20px;
}

.card{
  background:#0f172a;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:.4s;
  position:relative;
}

.card:hover{
  transform:scale(1.07);
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  width:90%;
  max-width:500px;
  animation:fade .5s ease;
}

@keyframes fade{
  from{transform:translateY(60px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* IMAGEN GRANDE */
.img-grande{
  width:100%;
  border-radius:20px;
  animation:subir .5s ease;
}

@keyframes subir{
  from{transform:translateY(80px)}
  to{transform:translateY(0)}
}

/* TEXTO DESLIZADO */
.info{
  background:white;
  color:black;
  margin-top:-20px;
  padding:20px;
  border-radius:0 0 20px 20px;
  animation:slideUp .6s ease;
}

@keyframes slideUp{
  from{transform:translateY(100px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

video{
  width:100%;
  border-radius:12px;
  margin-top:15px;
}

.close{
  position:absolute;
  top:15px;
  right:20px;
  font-size:25px;
  cursor:pointer;
}

/* COMPRA */
.compra{
  text-align:center;
  padding:60px 20px;
}

.btn{
  background:#22c55e;
  padding:15px 25px;
  border-radius:12px;
  color:white;
  text-decoration:none;
  font-weight:bold;
  display:inline-block;
  transition:.3s;
}

.btn:hover{
  transform:scale(1.08);
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>🚀 Generación DM</h1>
  <p>De cero a emprendedor en 30 días</p>
</div>

<!-- TARJETAS -->
<div class="grid">

  <div class="card" onclick="abrir(0)">
    <img src="imagen6.jpeg">
  </div>

  <div class="card" onclick="abrir(1)">
    <img src="imagen10.jpeg">
  </div>

  <div class="card" onclick="abrir(2)">
    <img src="imagen30.jpeg">
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="cerrar()">✖</span>
    <img id="imgModal" class="img-grande">

    <div class="info">
      <h3 id="titulo"></h3>
      <p id="texto"></p>
      <video id="video" controls></video>
    </div>
  </div>
</div>

<!-- COMPRA -->
<div class="compra">
  <h2>💳 Acceso inmediato</h2>
  <a href="https://mpago.la/1SEiJBr" target="_blank" class="btn" onclick="wa()">Comprar ahora</a>
</div>

<script>
const data=[
{
titulo:"¿Quién soy?",
texto:"Empresario ayudando a personas a generar ingresos desde cero.",
img:"imagen6.jpeg",
video:"video7.mp4"
},
{
titulo:"Resultados reales",
texto:"Personas normales logrando ingresos reales con este sistema.",
img:"imagen10.jpeg",
video:"video1.mp4"
},
{
titulo:"Testimonios",
texto:"Historias reales de alumnos que cambiaron su vida.",
img:"imagen30.jpeg",
video:"video6.mp4"
}
];

function abrir(i){
document.getElementById("modal").style.display="flex";
document.getElementById("imgModal").src=data[i].img;
document.getElementById("titulo").innerText=data[i].titulo;
document.getElementById("texto").innerText=data[i].texto;
document.getElementById("video").src=data[i].video;
}

function cerrar(){
document.getElementById("modal").style.display="none";
document.getElementById("video").pause();
}

/* WHATSAPP DESPUÉS DE PAGAR */
function wa(){
setTimeout(()=>{
window.open("https://wa.me/qr/Q3V6TYFKLD3EA1","_blank");
},4000);
}
</script>

</body>
</html>
