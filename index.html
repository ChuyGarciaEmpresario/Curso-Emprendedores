<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generación DM</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#020617;
  color:white;
}

/* HERO */
.hero{
  text-align:center;
  padding:70px 20px;
  background:linear-gradient(120deg,#0ea5e9,#22c55e);
}

.hero h1{
  font-size:28px;
}

/* GRID TARJETAS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:20px;
  padding:40px 20px;
}

.card{
  background:#0f172a;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  transition:.4s;
}

.card:hover{
  transform:scale(1.1);
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal-content{
  width:90%;
  max-width:520px;
  position:relative;
}

/* IMAGEN GRANDE */
.img-grande{
  width:100%;
  border-radius:20px;
  animation:subir .5s ease;
}

@keyframes subir{
  from{transform:translateY(80px)}
  to{transform:translateY(0)}
}

/* TEXTO DESLIZADO */
.info{
  background:white;
  color:black;
  margin-top:-25px;
  padding:22px;
  border-radius:0 0 20px 20px;
  animation:slideUp .6s ease;
}

@keyframes slideUp{
  from{transform:translateY(120px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

video{
  width:100%;
  border-radius:12px;
  margin-top:15px;
}

.close{
  position:absolute;
  top:-10px;
  right:0;
  font-size:25px;
  cursor:pointer;
}

/* COMPRA */
.compra{
  text-align:center;
  padding:60px 20px;
}

.btn{
  background:#22c55e;
  padding:16px 28px;
  border-radius:14px;
  color:white;
  text-decoration:none;
  font-weight:bold;
  display:inline-block;
  transition:.3s;
}

.btn:hover{
  transform:scale(1.08);
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>🚀 Generación DM</h1>
  <p>De cero a emprendedor en 30 días</p>
</div>

<!-- TARJETAS PREMIUM -->
<div class="grid">

  <div class="card" onclick="abrir(0)">
    <img src="https://images.unsplash.com/photo-1556740738-b6a63e27c4df">
  </div>

  <div class="card" onclick="abrir(1)">
    <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f">
  </div>

  <div class="card" onclick="abrir(2)">
    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d">
  </div>

  <div class="card" onclick="abrir(3)">
    <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c">
  </div>

  <div class="card" onclick="abrir(4)">
    <img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7">
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="cerrar()">✖</span>
    <img id="imgModal" class="img-grande">

    <div class="info">
      <h3 id="titulo"></h3>
      <p id="texto"></p>
      <video id="video" controls src="video7.mp4"></video>
    </div>
  </div>
</div>

<!-- COMPRA -->
<div class="compra">
  <h2>💳 Acceso inmediato</h2>
  <a href="https://mpago.la/1SEiJBr" target="_blank" class="btn" onclick="wa()">Comprar ahora</a>
</div>

<script>
const data=[
{
titulo:"Emprende desde cero",
texto:"Aprende a generar ingresos sin inversión y sin experiencia.",
img:"https://images.unsplash.com/photo-1556740738-b6a63e27c4df"
},
{
titulo:"Resultados reales",
texto:"Personas comunes logrando ingresos en días.",
img:"https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
},
{
titulo:"Mentalidad millonaria",
texto:"Cambia tu forma de pensar y transforma tu vida.",
img:"https://images.unsplash.com/photo-1504384308090-c894fdcc538d"
},
{
titulo:"Comunidad privada",
texto:"Rodeate de personas que también quieren crecer.",
img:"https://images.unsplash.com/photo-1519389950473-47ba0277781c"
},
{
titulo:"Historias reales",
texto:"Casos que te motivarán a dar el paso.",
img:"https://images.unsplash.com/photo-1492724441997-5dc865305da7"
}
];

function abrir(i){
document.getElementById("modal").style.display="flex";
document.getElementById("imgModal").src=data[i].img;
document.getElementById("titulo").innerText=data[i].titulo;
document.getElementById("texto").innerText=data[i].texto;
}

function cerrar(){
document.getElementById("modal").style.display="none";
}

function wa(){
setTimeout(()=>{
window.open("https://wa.me/qr/Q3V6TYFKLD3EA1","_blank");
},4000);
}
</script>

</body>
</html>
