<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compra confirmada</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#020617,#0f172a,#020617);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:40px;
  text-align:center;
  max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.folio{
  font-size:22px;
  font-weight:bold;
  margin:20px 0;
  color:#22c55e;
}

.btn{
  display:block;
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
  transition:.3s;
}

.whatsapp{
  background:#22c55e;
  color:white;
}

.whatsapp:hover{
  transform:scale(1.05);
}

.small{
  font-size:12px;
  opacity:.6;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="card">

  <h1>🎉 ¡Pago confirmado!</h1>
  <p>Bienvenido a la Generación DM</p>

  <div class="folio" id="folio"></div>

  <a id="waLink" class="btn whatsapp">
    👉 Enviar comprobante por WhatsApp
  </a>

  <div class="small">
    Guarda tu folio, lo usaremos para darte acceso.
  </div>

</div>

<script>
// Generar folio automático
const folio = "DM-" + Math.floor(100000 + Math.random()*900000);
document.getElementById("folio").innerText = folio;

// TU LINK DE WHATSAPP
const baseLink = "https://wa.me/qr/Q3V6TYFKLD3EA1";

// Mensaje automático
const mensaje = encodeURIComponent(
`Hola, ya realicé mi pago del curso 🚀
Mi folio es: ${folio}
Quiero recibir acceso.`
);

// Crear link final
document.getElementById("waLink").href = baseLink + "?text=" + mensaje;
</script>

</body>
</html>
